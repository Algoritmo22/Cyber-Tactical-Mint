name: Lint y pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -x -s bash scripts/*.sh scripts/lib/*.sh scripts/helpers/*.sh cyber-tactical-mint.sh

  dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        theme: [cyber, military, amber]
    steps:
      - uses: actions/checkout@v4
      - name: Instalación en seco (${{ matrix.theme }})
        run: ./scripts/install.sh --dry-run --skip-deps --skip-fonts --theme ${{ matrix.theme }}
      - name: Instalación real en un HOME temporal y desinstalación
        run: |
          export HOME="$(mktemp -d)"
          ./scripts/install.sh --skip-deps --skip-fonts --no-launch --theme ${{ matrix.theme }}
          if grep -rn "@@" "$HOME/.config" "$HOME/.local/share/plank" 2>/dev/null; then
            echo "Quedaron tokens sin resolver"; exit 1
          fi
          ./scripts/uninstall.sh --purge
