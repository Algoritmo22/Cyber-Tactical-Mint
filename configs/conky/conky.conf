-- Cyber-Tactical-Mint :: conky.conf
-- Los marcadores __HOME__ y __NET_IFACE__ los reemplaza scripts/install.sh
conky.config = {
    alignment = 'top_right',
    gap_x = 30,
    gap_y = 60,
    minimum_width = 360,
    maximum_width = 360,
    minimum_height = 440,

    update_interval = 1,
    double_buffer = true,
    no_buffers = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=9',
    default_color = '#c0fff4',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    lua_load = '__HOME__/.config/conky/gauges.lua',
    lua_draw_hook_pre = 'main',
}

conky.text = [[
${voffset 405}${goto 28}${color #00f2d9}NET${color} __NET_IFACE__  ${color #00f2d9}▼${color} ${downspeed __NET_IFACE__}  ${color #00f2d9}▲${color} ${upspeed __NET_IFACE__}
${goto 28}${color #00f2d9}UP${color} ${uptime_short}   ${color #00f2d9}FREQ${color} ${freq_g 1}GHz
]]
