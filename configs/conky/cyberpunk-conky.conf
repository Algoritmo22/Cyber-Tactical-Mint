-- ==============================================================================
-- CONFIGURACIÓN: Cyber-Tactical-Mint HUD Monitor
-- ==============================================================================

conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '00FF66',  -- Verde Neón Táctico
    default_outline_color = '000000',
    default_shade_color = '000000', -- Color de la sombra
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = true,         -- Mantiene las sombras para resaltar las fuentes
    gap_x = 30,
    gap_y = 60,
    minimum_width = 370,        -- Ligeramente más ancho para evitar que las barras se corten
    minimum_height = 750,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_window_hints = 'override_redirect,below,sticky,skip_taskbar,skip_pager',
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop', -- Clave para integrarse de forma permanente al fondo
    own_window_transparent = false, -- Desactivado para permitir el fondo oscuro táctico
    own_window_argb_visual = true,
    own_window_argb_value = 130,   -- 50% de opacidad oscura para que las letras verdes resalten al 100%
    own_window_colour = '0B0F19',  -- Fondo oscuro militar azulado/negro
    update_interval = 1.0,
    uppercase = false,
    use_xft = true,
    font = 'SpaceMono Nerd Font:style=Bold:size=10', -- Letras gruesas de alta visibilidad
    
    color1 = '00FFFF', 
    color2 = 'FFFFFF', 
    color3 = 'FF3333', 
}

conky.text = [[
${color 00FF66} ██████╗██╗   ██╗██████╗ ███████╗██████╗ 
 ██╔════╝╚██╗ ██╔╝██╔══██╗██╔════╝██╔══██╗
 ██║      ╚████╔╝ ██████╔╝█████╗  ██████╔╝
 ██║       ╚██╔╝  ██╔══██╗██╔══╝  ██╔══██╗
 ╚██████╗   ██║   ██████╔╝███████╗██║  ██║
  ╚═════╝   ╚═╝   ╚══════╝╚══════╝╚═╝  ╚═╝
${color 00FFFF}SYSTEM TACTICAL OVERVIEW -------------------${color}
${color FFFFFF}OS:$color ${execi 86400 lsb_release -ds}
${color FFFFFF}Kernel:$color $kernel
${color FFFFFF}Uptime:$color $uptime

${color 00FFFF}CPU RECOGNITION ---------------------------${color}
${color FFFFFF}Usage:$color $cpu% ${color 00FF66}${cpubar 6,180}${color}
${color FFFFFF}Core 1:$color ${cpu cpu1}% ${goto 140}${color FFFFFF}Core 2:$color ${cpu cpu2}%
${color FFFFFF}Core 3:$color ${cpu cpu3}% ${goto 140}${color FFFFFF}Core 4:$color ${cpu cpu4}%

${color 00FFFF}MEMORY CONTROL ----------------------------${color}
${color FFFFFF}RAM Usage:$color $mem/$memmax - $memperc%
${color 00FF66}${membar 6,300}${color}
${color FFFFFF}Swap:$color $swap/$swapmax

${color 00FFFF}NETWORK HUD (wlp4s2) ------------------------${color}
${color FFFFFF}Inbound:$color ${downspeed wlp4s2} ${goto 180}${color FFFFFF}Outbound:$color ${upspeed wlp4s2}
${color 00FF66}${downspeedgraph wlp4s2 35,140 00FF66 00FFFF} ${goto 180}${upspeedgraph wlp4s2 35,140 00FF66 00FFFF}${color}

${color 00FFFF}STORAGE AREA ------------------------------${color}
${color FFFFFF}System Root (/) :$color ${fs_used /}/${fs_size /} 
${color 00FF66}${fs_bar 6,300 /}${color}

${color1}📡 HARDWARE THERMAL MONITOR ----------------${color}
${color2}🔥 CPU Intel Core:$color ${hwmon coretemp temp 1}°C ${alignr}${color3}[ MAX: 85°C ]$color
${color 00FF66}${hwmonbar coretemp temp 1 6,350}$color

${color2}🎮 GPU AMD Radeon:$color ${hwmon amdgpu temp 1}°C ${alignr}${color1}Estado: Activo$color
${color 00FF66}${hwmonbar amdgpu temp 1 6,350}$color
]]
